<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
  />

  <title>Real Vs Reels</title>

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#070B14;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:white;
    }

    .app-container{
      display:flex;
      flex-direction:column;
      width:100%;
      height:100%;
      position:relative;
    }

    /* =========================================
       TOP BAR
    ========================================= */

    .utility-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 18px;
      background:rgba(15,23,42,.75);
      border-bottom:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      z-index:20;
      flex-shrink:0;
    }

    .title-group span{
      font-size:10px;
      color:#60a5fa;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.12em;
    }

    .title-group h1{
      margin:3px 0 0;
      font-size:15px;
      font-weight:700;
      color:#fff;
      letter-spacing:-.02em;
    }

    .back-btn{
      text-decoration:none;
      color:#cbd5e1;
      font-size:12px;
      font-weight:600;
      padding:8px 14px;
      border-radius:10px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      transition:.25s ease;
    }

    .back-btn:hover{
      color:white;
      background:rgba(255,255,255,.1);
      border-color:rgba(255,255,255,.16);
    }

    /* =========================================
       IFRAME AREA
    ========================================= */

    .iframe-wrapper{
      position:relative;
      flex:1;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#070B14;
    }

    .iframe-viewport{
      width:100%;
      height:100%;
      border:none;
      background:#070B14;
      opacity:0;
      transition:opacity .5s ease;
    }

    .iframe-viewport.loaded{
      opacity:1;
    }

    /* =========================================
       LOADING SCREEN
    ========================================= */

    .loader-screen{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:18px;
      background:
        radial-gradient(circle at top, rgba(59,130,246,.15), transparent 40%),
        #070B14;
      z-index:10;
      transition:opacity .4s ease, visibility .4s ease;
    }

    .loader-screen.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .spinner{
      width:56px;
      height:56px;
      border-radius:50%;
      border:3px solid rgba(255,255,255,.08);
      border-top-color:#60a5fa;
      animation:spin .8s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .loader-title{
      font-size:18px;
      font-weight:700;
      letter-spacing:-0.02em;
      color:white;
    }

    .loader-text{
      font-size:13px;
      color:#94a3b8;
      text-align:center;
      max-width:320px;
      line-height:1.6;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width:640px){

      .utility-bar{
        padding:10px 12px;
      }

      .title-group h1{
        font-size:13px;
      }

      .back-btn{
        font-size:11px;
        padding:7px 10px;
      }

      .loader-title{
        font-size:16px;
      }

    }

  </style>

</head>

<body>

  <div class="app-container">

    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="utility-bar">

      <div class="title-group">
        <span>Application Subpage</span>
        <h1>Real Vs Reels</h1>
      </div>

      <a
        href="https://ebubeikechi.github.io"
        class="back-btn"
      >
        ← Main Portfolio
      </a>

    </header>

    <!-- =========================================
         IFRAME AREA
    ========================================= -->

    <div class="iframe-wrapper">

      <!-- LOADING STATE -->

      <div id="loaderScreen" class="loader-screen">

        <div class="spinner"></div>

        <div class="loader-title">
          Loading Experience...
        </div>

        <div class="loader-text">
          Initializing interactive portal and preparing
          application environment.
        </div>

      </div>

      <!-- IFRAME -->

      <iframe
        id="portalFrame"
        class="iframe-viewport"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>

    </div>

  </div>

  <script>

    const iframe =
      document.getElementById("portalFrame");

    const loader =
      document.getElementById("loaderScreen");

    // Delay iframe injection slightly
    // so UI paints instantly first

    window.addEventListener("load", () => {

      requestAnimationFrame(() => {

        setTimeout(() => {

          iframe.src =
            "https://script.google.com/macros/s/AKfycbygv6Ckk309zIHremjXrSVq9sVvhpPGl7sl5lmT-9soC1-tTk6zy3uTO2tHVOg_aFAT/exec";

        }, 150);

      });

    });

    // When iframe fully loads

    iframe.addEventListener("load", () => {

      iframe.classList.add("loaded");

      loader.classList.add("hidden");

    });

  </script>

</body>
</html>
